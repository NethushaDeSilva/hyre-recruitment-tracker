<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <title>Hyre — Your next role, one clear process.</title>
    <meta
      name="description"
      content="Hyre is the hiring platform that keeps every candidate, interview and decision in one fair, transparent process — for applicants and hiring teams alike."
    />

    <!-- Apply saved theme before paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          // Default to LIGHT mode on a first visit (ignore the OS dark preference).
          // The user can switch with the toggle, and their choice is remembered.
          var t = localStorage.getItem("hiree-theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Inter (design system typeface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
