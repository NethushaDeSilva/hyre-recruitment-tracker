<!-- Render-only version: just the SVG, fixed light theme, for screenshotting to PNG. Not a deliverable file itself. -->
<style>
  :root {
    --ink: #17150F; --paper: #FBF8F1; --surface: #FFFFFF; --surface-2: #F4F0E6;
    --gold-line: #A9760A; --gold-fill: #F5C518; --line: #DAD3C2; --line-strong: #C6BCA2;
    --muted: #6B6555;
    --tint-account: #EDF0E8; --tint-journey: #E6EEF6; --tint-setup: #F6EEDF;
    --tint-board: #F0EAF6; --tint-views: #E9F1E7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  .frame { width: 2000px; padding: 36px; background: var(--paper); }
  svg { display: block; }
  text { font-family: "Segoe UI", "Helvetica Neue", Arial, ui-sans-serif, sans-serif; fill: var(--ink); }
  .uc-label { font-size: 13.4px; font-weight: 600; text-anchor: middle; }
  .actor-label { font-size: 14px; font-weight: 700; text-anchor: middle; font-family: "Century Gothic", "Avenir Next", Futura, ui-sans-serif, sans-serif; }
  .actor-stereo { font-size: 10.5px; font-style: italic; text-anchor: middle; fill: var(--muted); }
  .band-label { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  .sys-title { font-size: 13.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; fill: var(--gold-line); font-family: "Century Gothic","Avenir Next",Futura,sans-serif; }
  .rel-label { font-size: 10.5px; font-style: italic; text-anchor: middle; fill: var(--gold-line); font-weight: 600; }
  .uc { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.6; }
  .title-block { font-family: "Century Gothic","Avenir Next",Futura,sans-serif; margin: 0 0 18px; }
  .title-block h1 { font-size: 24px; margin: 0 0 4px; color: var(--ink); }
  .title-block p { font-size: 13px; margin: 0; color: var(--gold-line); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-family: ui-monospace, monospace; }
</style>
